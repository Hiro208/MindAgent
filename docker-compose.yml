

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindagent-postgres
    environment:
      POSTGRES_DB: mindagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindagent"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: mindagent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
